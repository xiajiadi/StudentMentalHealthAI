[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-mental-health-ai-knowledge-pipeline"
version = "0.1.0"
description = "Traceable, review-gated knowledge ingestion pipeline for StudentMentalHealthAI"
requires-python = ">=3.10,<3.15"
dependencies = [
  "docling==2.125.0",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
]

[project.scripts]
knowledge-pipeline = "knowledge_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

