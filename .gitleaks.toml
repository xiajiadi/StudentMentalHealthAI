title = "StudentMentalHealthAI secret scan policy"

[extend]
useDefault = true

[[allowlists]]
description = "Workspace dependencies, build caches, and generated runtime data are not repository inputs."
paths = [
  '''(^|[\\/])\.venv([\\/]|$)''',
  '''(^|[\\/])\.venv[0-9]+([\\/]|$)''',
  '''(^|[\\/])node_modules([\\/]|$)''',
  '''(^|[\\/])\.pytest_cache([\\/]|$)''',
  '''(^|[\\/])\.ruff_cache([\\/]|$)''',
  '''(^|[\\/])\.hypothesis([\\/]|$)''',
  '''(^|[\\/])\.schemathesis([\\/]|$)''',
  '''(^|[\\/])dist([\\/]|$)''',
  '''(^|[\\/])data[\\/]indexes([\\/]|$)''',
  '''(^|[\\/])data[\\/]cache([\\/]|$)'''
]

[[allowlists]]
description = "Known non-secret SHA-256 evidence and tokenizer labels in accepted synthetic fixtures."
paths = [
  '''^05_rag-engine/src/rag_engine/cli\.py$''',
  '''^05_rag-engine/reports/RAG_RUNTIME_COMPATIBILITY\.md$''',
  '''^05_rag-engine/reports/rag_eval_round1\.json$''',
  '''^15_demo/integration/reports/integration_round1_evaluation\.json$''',
  '''^15_demo/integration/scripts/write_final_evaluation\.py$'''
]

[[allowlists]]
description = "Known non-secret contract hashes recorded as provenance for the candidate-only round."
paths = [
  '''^14_docs/contract-hardening/API_OPERATION_INVENTORY\.md$''',
  '''^14_docs/contract-hardening/CONTRACT_PROMOTION_PROPOSAL_V0_2\.md$''',
  '''^14_docs/contract-hardening/reports/CONTRACT_API_HARDENING_ROUND1_ACCEPTANCE\.md$''',
  '''^14_docs/contract-hardening/reports/contract_api_hardening_round1_evaluation\.json$''',
  '''^14_docs/contract-hardening/reports/contract_api_hardening_round1_closure_evaluation\.json$'''
]
