# Pre-certificate listener. Serve only ACME challenges; keep the site closed until TLS is ready.
server {
    listen 0.0.0.0:80;
    server_name psynova.top www.psynova.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
