# Install only after the Synthetic Demo privacy and Safety gates pass.
# The Backend remains loopback-only; Nginx is the sole public application entry.
server {
    listen 0.0.0.0:80;
    server_name psynova.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://psynova.top$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    server_name psynova.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/psynova.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psynova.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PSYNOVA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/psynova-school-demo/web;
    index index.html;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
