<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PsyNova 一次性凭据查看</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: #20242c; background: #f7f8fa; }
    body { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    main { background: #fff; border: .5px solid #d8dce3; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 8px 0 16px; color: #555e6b; }
    label { display: block; margin: 14px 0; font-weight: 600; }
    input[type="file"], input[type="password"] { display: block; box-sizing: border-box; width: 100%; min-height: 40px; margin-top: 6px; padding: 8px; border: .5px solid #b9c0ca; background: #fff; color: inherit; font: inherit; }
    button { min-height: 38px; margin: 4px 8px 4px 0; padding: 6px 14px; border: .5px solid #8792a2; background: #fff; color: #20242c; font: inherit; cursor: pointer; }
    button.primary { border-color: #1769aa; background: #1769aa; color: #fff; }
    button:focus-visible, input:focus-visible { outline: 2px solid #2878bd; outline-offset: 2px; }
    #status { min-height: 24px; margin: 12px 0; color: #a12622; }
    #results { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: .5px solid #d8dce3; text-align: left; vertical-align: top; }
    th { color: #4f5967; font-weight: 600; }
    .token { width: 100%; min-width: 260px; box-sizing: border-box; padding: 6px; border: .5px solid #d8dce3; background: #fff; color: inherit; font: 13px/1.4 ui-monospace, Consolas, monospace; }
    .small { font-size: 13px; color: #697382; }
    @media (max-width: 640px) { body { margin: 12px auto; padding: 0 10px; } main { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>查看一次性登录凭据</h1>
    <p>此页面在本机浏览器中解密文件，不联网、不保存结果。一次性凭据用于首次登录并设置新密码，使用后即失效。</p>
    <label>加密凭据文件<input id="file" type="file" accept="application/json,.json"></label>
    <label>创建加密文件时使用的口令<input id="passphrase" type="password" autocomplete="off"></label>
    <button id="decrypt" class="primary" type="button">本机解密</button>
    <button id="clear" type="button">清除内容</button>
    <button id="toggle" type="button" hidden>显示全部凭据</button>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="results"></div>
    <p class="small">不要把解密结果复制到聊天、邮件或共享文档。查看后请清除页面并删除不再需要的文件。</p>
  </main>
  <script>
    (() => {
      'use strict'
      const MAX_FILE_BYTES = 2000000
      const MAX_RECORDS = 200
      const fileInput = document.getElementById('file')
      const passphraseInput = document.getElementById('passphrase')
      const status = document.getElementById('status')
      const results = document.getElementById('results')
      const decryptButton = document.getElementById('decrypt')
      const clearButton = document.getElementById('clear')
      const toggleButton = document.getElementById('toggle')
      let revealed = false

      function decodeBase64(value, expectedLength) {
        if (typeof value !== 'string' || value.length > 12000000 || !/^[A-Za-z0-9+/]*={0,2}$/.test(value)) throw new Error('文件格式无效')
        const bytes = Uint8Array.from(atob(value), (character) => character.charCodeAt(0))
        if (expectedLength && bytes.length !== expectedLength) throw new Error('文件格式无效')
        return bytes
      }

      function validRecord(record) {
        return record && typeof record === 'object'
          && typeof record.login_name === 'string'
          && typeof record.credential === 'string'
          && typeof record.expires_at === 'string'
      }

      function appendCell(row, value) {
        const cell = document.createElement('td')
        cell.textContent = value == null ? '' : String(value)
        row.append(cell)
        return cell
      }

      function render(records) {
        const table = document.createElement('table')
        const head = document.createElement('thead')
        const header = document.createElement('tr')
        for (const label of ['角色', '姓名', '登录用户名', '一次性凭据', '有效期']) {
          const cell = document.createElement('th')
          cell.scope = 'col'
          cell.textContent = label
          header.append(cell)
        }
        head.append(header)
        const body = document.createElement('tbody')
        for (const record of records) {
          const row = document.createElement('tr')
          const roleName = record.role === 'teacher' ? '普通教师' : record.role === 'student' ? '学生' : ''
          appendCell(row, roleName)
          appendCell(row, record.display_name)
          appendCell(row, record.login_name)
          const tokenCell = document.createElement('td')
          const token = document.createElement('input')
          token.type = 'password'
          token.readOnly = true
          token.value = record.credential
          token.className = 'token'
          token.setAttribute('aria-label', `一次性凭据 ${record.login_name}`)
          tokenCell.append(token)
          row.append(tokenCell)
          appendCell(row, record.expires_at)
          body.append(row)
        }
        table.append(head, body)
        results.replaceChildren(table)
        revealed = false
        toggleButton.hidden = false
        toggleButton.textContent = '显示全部凭据'
        status.style.color = '#176b3a'
        status.textContent = `已在本机解密 ${records.length} 条凭据。`
      }

      function clearView() {
        results.replaceChildren()
        fileInput.value = ''
        passphraseInput.value = ''
        status.textContent = ''
        status.style.color = ''
        toggleButton.hidden = true
        revealed = false
      }

      decryptButton.addEventListener('click', async () => {
        results.replaceChildren()
        status.textContent = ''
        toggleButton.hidden = true
        try {
          const file = fileInput.files && fileInput.files[0]
          if (!file || file.size < 1 || file.size > MAX_FILE_BYTES) throw new Error('请选择有效的凭据文件')
          if (!passphraseInput.value || !globalThis.crypto?.subtle) throw new Error('请填写加密口令并使用支持安全加密的浏览器')
          const encrypted = JSON.parse(await file.text())
          if (encrypted.format !== 'psynova-credentials-encrypted-v1'
            || encrypted.algorithm !== 'AES-256-GCM'
            || encrypted.kdf !== 'PBKDF2-SHA-256'
            || encrypted.iterations !== 310000) throw new Error('不支持此文件格式')
          const salt = decodeBase64(encrypted.salt, 16)
          const iv = decodeBase64(encrypted.iv, 12)
          const ciphertext = decodeBase64(encrypted.ciphertext)
          const passphraseBytes = new TextEncoder().encode(passphraseInput.value)
          let material
          try {
            material = await crypto.subtle.importKey('raw', passphraseBytes, 'PBKDF2', false, ['deriveKey'])
          } finally {
            passphraseBytes.fill(0)
          }
          const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
          const plaintext = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext))
          try {
            const payload = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(plaintext))
            if (!payload || !Array.isArray(payload.credentials) || payload.credentials.length < 1 || payload.credentials.length > MAX_RECORDS || !payload.credentials.every(validRecord)) throw new Error('凭据内容无效')
            render(payload.credentials)
          } finally {
            plaintext.fill(0)
          }
        } catch {
          status.style.color = '#a12622'
          status.textContent = '解密失败。请检查文件和口令后重试。'
        }
      })

      toggleButton.addEventListener('click', () => {
        revealed = !revealed
        for (const input of results.querySelectorAll('.token')) input.type = revealed ? 'text' : 'password'
        toggleButton.textContent = revealed ? '隐藏全部凭据' : '显示全部凭据'
      })
      clearButton.addEventListener('click', clearView)
      window.addEventListener('pagehide', clearView, { once: true })
    })()
  </script>
</body>
</html>
