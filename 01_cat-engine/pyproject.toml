[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-mental-health-ai-cat-engine"
version = "0.1.0"
description = "Synthetic, provider-adapted CAT engineering baseline"
requires-python = ">=3.14,<3.15"
dependencies = [
  "adaptivetesting==1.2.1",
  "fastapi==0.141.1",
  "jsonschema>=4.23,<5",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
